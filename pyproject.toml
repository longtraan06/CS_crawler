[project]
name = "pagecrawl"
version = "1.0.0"
description = "Crawl visible posts from a page feed you own"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "playwright>=1.49",
  "playwright-stealth>=2.0",
  "pydantic>=2.10",
  "typer>=0.15",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
pagecrawl = "pagecrawl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagecrawl = ["dashboard.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
